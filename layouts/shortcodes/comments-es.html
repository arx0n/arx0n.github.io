<div class="comments-wrapper">

    <div class="comments-gate">

        <p class="comments-message">
            Para participar en los comentarios,<br>
            sígueme primero.
        </p>

        <div class="comments-socials">

            <a
                href="https://www.instagram.com/aarxngonzalez"
                target="_blank"
                rel="noopener noreferrer"
                class="comments-social"
                data-social="instagram"
                aria-label="Instagram"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle cx="17.5" cy="6.5" r="1"></circle>
                </svg>
            </a>

            <a
                href="https://www.tiktok.com/@arx0n.tiktok"
                target="_blank"
                rel="noopener noreferrer"
                class="comments-social"
                data-social="tiktok"
                aria-label="TikTok"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 3v11.2a4.8 4.8 0 1 1-4-4.73"></path>
                    <path d="M15 3c.4 2.7 2.1 4.4 4.5 4.7"></path>
                </svg>
            </a>

        </div>

        <button
            id="comments-continue"
            class="comments-continue"
            disabled
        >
            Ya te sigo →
        </button>

    </div>

    <div id="giscus-container" class="giscus-container" hidden>

        <script src="https://giscus.app/client.js"
                data-repo="arx0n/arx0n.github.io"
                data-repo-id="R_kgDOUp-BgA"
                data-category="Comments"
                data-category-id="DIC_kwDOUp-BgM4DGgb3"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="preferred_color_scheme"
                data-lang="es"
                crossorigin="anonymous"
                async>
        </script>

    </div>

</div>


<style>

.comments-wrapper {
    margin-top: 40px;
}

.comments-gate {
    text-align: center;
    padding: 35px 20px;
}

.comments-message {
    margin-bottom: 25px;
    font-size: 15px;
    opacity: 0.8;
}

.comments-socials {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 25px;
}

.comments-social {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;

    color: #aaa;

    transition:
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.comments-social svg {
    width: 23px;
    height: 23px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;

    transition: all 0.2s ease;
}


/* INSTAGRAM */

.comments-social[data-social="instagram"]:hover {
    color: #e1306c;
    border-color: #e1306c;

    box-shadow:
        0 0 12px rgba(225, 48, 108, 0.35);

    transform: translateY(-2px);
}

.comments-social[data-social="instagram"].visited {
    color: #e1306c;
    border-color: #e1306c;

    box-shadow:
        0 0 12px rgba(225, 48, 108, 0.3);
}


/* TIKTOK */

.comments-social[data-social="tiktok"]:hover {
    color: #8b5cf6;
    border-color: #8b5cf6;

    box-shadow:
        0 0 12px rgba(139, 92, 246, 0.35);

    transform: translateY(-2px);
}

.comments-social[data-social="tiktok"].visited {
    color: #8b5cf6;
    border-color: #8b5cf6;

    box-shadow:
        0 0 12px rgba(139, 92, 246, 0.3);
}


/* BOTÓN */

.comments-continue {
    padding: 9px 20px;

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 7px;

    background: transparent;
    color: rgba(255, 255, 255, 0.3);

    cursor: not-allowed;

    transition:
        color 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.comments-continue.ready {
    color: #fff;
    background: #22c55e;
    border-color: #22c55e;

    cursor: pointer;

    box-shadow:
        0 0 14px rgba(34, 197, 94, 0.25);
}

.comments-continue.ready:hover {
    background: #16a34a;
    border-color: #16a34a;

    box-shadow:
        0 0 20px rgba(34, 197, 94, 0.35);
}


/* GISCUS */

.giscus-container {
    margin-top: 30px;
}

</style>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const socialLinks = document.querySelectorAll(".comments-social");
    const continueButton = document.getElementById("comments-continue");
    const giscusContainer = document.getElementById("giscus-container");
    const commentsGate = document.querySelector(".comments-gate");

    const visited = {
        instagram: false,
        tiktok: false
    };


    socialLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            const social = this.dataset.social;

            visited[social] = true;

            this.classList.add("visited");


            if (visited.instagram && visited.tiktok) {

                continueButton.disabled = false;
                continueButton.classList.add("ready");

            }

        });

    });


    continueButton.addEventListener("click", function () {

        if (!visited.instagram || !visited.tiktok) {
            return;
        }

        commentsGate.style.display = "none";
        giscusContainer.hidden = false;

    });

});

</script>
